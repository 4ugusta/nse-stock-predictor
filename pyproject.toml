[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indian-stock-predictor"
version = "0.1.0"
description = "Indian NSE Stock Predictor with technical analysis, signals, and news sentiment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "August Abhardwaj" }
]
keywords = ["stock", "nse", "trading", "technical-analysis", "india"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "pydantic>=2.5",
    "pydantic-settings>=2.1",

    # Data providers
    "yfinance>=0.2.40",
    "kiteconnect>=5.0",
    "nselib>=2.4",
    "xlrd>=2.0.1",
    "pyotp>=2.9",
    "requests>=2.31",

    # Data processing
    "pandas>=2.1",
    "numpy>=1.26",

    # Technical analysis
    "pandas-ta>=0.3.14b",

    # Visualization
    "plotly>=5.18",

    # News & Sentiment
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "vaderSentiment>=3.3.2",
    "lxml>=5.0",

    # Web dashboard
    "streamlit>=1.31",

    # CLI
    "typer>=0.9",
    "rich>=13.7",

    # Storage & Caching
    "sqlalchemy>=2.0",
    "cachetools>=5.3",

    # AI Analysis
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.9",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
nse-predict = "stock_predictor.presentation.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_predictor"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
